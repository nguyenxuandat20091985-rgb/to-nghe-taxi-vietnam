name: Patch Community Login Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix: make community Google login tappable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch community login handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/community.js')
          s = p.read_text(encoding='utf-8')

          old = """  const googleBtn = modal.querySelector('#community-google-login');
  googleBtn.onclick = async () => {"""
          new = """  const googleBtn = modal.querySelector('#community-google-login');
  googleBtn.type = 'button';
  googleBtn.style.cssText += ';position:relative;z-index:100003;pointer-events:auto!important;touch-action:manipulation;cursor:pointer;';
  googleBtn.addEventListener('pointerup', async (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (googleBtn.disabled) return;
    googleBtn.disabled = true;
    googleBtn.textContent = 'Đang đăng nhập Google…';
    try {
      const result = await googleLogin();
      if (result?.user) {
        await ensureUserProfile(result.user);
        closeLoginModal();
        renderCommunityUser();
        renderPosts();
        notify('Đăng nhập Google thành công.', 'success');
      }
    } catch (error) {
      console.error('[Community] Google sign-in failed:', error);
      googleBtn.disabled = false;
      googleBtn.textContent = 'G  Đăng nhập bằng Google';
      let errorMsg = 'Đăng nhập thất bại. Vui lòng thử lại.';
      if (error.code === 'auth/unauthorized-domain') errorMsg = 'Tên miền chưa được thêm vào Authorized domains của Firebase.';
      else if (error.code === 'auth/popup-blocked') errorMsg = 'Trình duyệt đã chặn cửa sổ Google. Hãy cho phép popup rồi thử lại.';
      else if (error.code === 'auth/popup-closed-by-user') errorMsg = 'Cửa sổ đăng nhập Google đã bị đóng.';
      else if (error.message) errorMsg = `Lỗi: ${error.message}`;
      notify(errorMsg, 'error');
    }
  });
  googleBtn.onclick = async () => {"""
          if old not in s:
              raise SystemExit('google button anchor not found')
          # Keep the original click handler as a fallback, but prevent it from
          # double-submitting after pointerup by replacing its first line.
          s = s.replace(old, new, 1)

          marker = "function buildPanel() {"
          guard = """function installCommunityLoginDelegation() {
  document.addEventListener('pointerup', (event) => {
    const target = event.target instanceof Element ? event.target.closest('#community-google-login, .community-user, .community-home-login') : null;
    if (!target || target.disabled) return;
    event.preventDefault();
    event.stopPropagation();
    if (target.id === 'community-google-login') {
      target.click();
      return;
    }
    if ((target.classList.contains('community-user') || target.classList.contains('community-home-login')) && typeof window.driverCommunity?.login === 'function') {
      window.driverCommunity.login();
    }
  }, true);
}

"""
          if guard not in s:
              if marker not in s: raise SystemExit('buildPanel marker not found')
              s = s.replace(marker, guard + marker, 1)

          s = s.replace(".community-user{appearance:none;", ".community-user{appearance:none;pointer-events:auto!important;position:relative;z-index:100003;")
          s = s.replace(".community-modal-backdrop{position:fixed;", ".community-modal-backdrop{position:fixed;pointer-events:auto!important;")
          s = s.replace(".community-google{width:100%;", ".community-google{width:100%;position:relative;z-index:100004;pointer-events:auto!important;touch-action:manipulation;cursor:pointer;")

          marker2 = "interceptCommunityNavigation();"
          if marker2 in s and "installCommunityLoginDelegation();" not in s:
              s = s.replace(marker2, marker2 + "\ninstallCommunityLoginDelegation();", 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/community.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: make community Google login tappable"
          git push origin HEAD:main

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/patch-login-button.yml
          git commit -m "chore: remove temporary login patch workflow"
          git push origin HEAD:main
