name: Hotfix Community Login Touch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: make Community login touch target reliable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch community touch target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/community.js')
          s=p.read_text(encoding='utf-8')
          old="""  modal.querySelector('.community-modal-close').onclick = closeLoginModal;
  modal.addEventListener('click', (e) => { if (e.target === modal) closeLoginModal(); });

  const googleBtn = modal.querySelector('#community-google-login');
  googleBtn.onclick = async () => {"""
          new="""  modal.querySelector('.community-modal-close').onclick = closeLoginModal;
  modal.addEventListener('click', (e) => { if (e.target === modal) closeLoginModal(); });

  const googleBtn = modal.querySelector('#community-google-login');
  googleBtn.style.cssText += ';position:relative;z-index:100003;pointer-events:auto;touch-action:manipulation;cursor:pointer;min-height:48px;';
  const runGoogleLogin = async (event) => {
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if (googleBtn.disabled) return;
    googleBtn.disabled = true;
    googleBtn.textContent = 'Đang đăng nhập Google…';
    try {
      const result = await googleLogin();
      if (result?.user) {
        await ensureUserProfile(result.user);
        closeLoginModal();
        renderCommunityUser();
        renderPosts();
        notify('Đăng nhập Google thành công.', 'success');
      }
    } catch (error) {
      console.error('[Community] Google sign-in failed:', error);
      googleBtn.disabled = false;
      googleBtn.textContent = 'G  Đăng nhập bằng Google';
      let errorMsg = 'Đăng nhập thất bại. Vui lòng thử lại.';
      if (error.code === 'auth/unauthorized-domain') errorMsg = 'Tên miền chưa được thêm vào Authorized domains của Firebase.';
      else if (error.code === 'auth/popup-blocked') errorMsg = 'Trình duyệt đã chặn cửa sổ Google. Hãy thử lại.';
      else if (error.code === 'auth/popup-closed-by-user') errorMsg = 'Cửa sổ đăng nhập Google đã bị đóng.';
      else if (error.message) errorMsg = `Lỗi: ${error.message}`;
      notify(errorMsg, 'error');
    }
  };
  googleBtn.addEventListener('pointerup', runGoogleLogin, { capture: true });
  googleBtn.addEventListener('touchend', runGoogleLogin, { capture: true, passive: false });
  googleBtn.onclick = runGoogleLogin;"""
          if old not in s: raise SystemExit('login modal anchor not found')
          s=s.replace(old,new,1)
          # Remove the old duplicated click handler body: the replacement above
          # inserted the complete handler, so delete the original assignment/body.
          start="  googleBtn.onclick = async () => {\n    googleBtn.disabled = true;\n    googleBtn.textContent = 'Đang đăng nhập Google…';"
          pos=s.find(start)
          if pos!=-1:
              # This should not remain after replacement; fail rather than risk malformed JS.
              raise SystemExit('old google handler unexpectedly remains')

          old2="""  panel.querySelector('.community-user').onclick = () => {
    if (!user()) loginModal('đăng bài và thả tim');
  };"""
          new2="""  const communityUserButton = panel.querySelector('.community-user');
  communityUserButton.style.cssText += ';position:relative;z-index:100002;pointer-events:auto;touch-action:manipulation;cursor:pointer;min-height:48px;';
  const openCommunityLogin = (event) => {
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if (!user()) loginModal('đăng bài và thả tim');
  };
  communityUserButton.addEventListener('pointerup', openCommunityLogin, { capture: true });
  communityUserButton.addEventListener('touchend', openCommunityLogin, { capture: true, passive: false });
  communityUserButton.onclick = openCommunityLogin;"""
          if old2 not in s: raise SystemExit('community user anchor not found')
          s=s.replace(old2,new2,1)

          # Make the topbar itself establish a stacking context above decorative layers.
          s=s.replace(".community-topbar{display:grid;", ".community-topbar{position:relative;z-index:100001;display:grid;", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check js/community.js
      - name: Commit and remove fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/community.js
          git commit -m 'fix: make Community login touch target reliable'
          git rm .github/workflows/hotfix-community-touch.yml
          git commit -m 'chore: remove temporary touch hotfix'
          git push origin HEAD:main
