name: Fix Community Google Login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix: rebuild Community Google login flow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch community login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/community.js')
          s=p.read_text()
          old="""async function googleLogin() {\n  const provider = new GoogleAuthProvider();\n  provider.setCustomParameters({ prompt: 'select_account' });\n  try {\n    return await signInWithPopup(auth, provider);\n  } catch (error) {\n    const fallbackCodes = new Set([\n      'auth/popup-blocked',\n      'auth/popup-closed-by-user',\n      'auth/cancelled-popup-request',\n      'auth/operation-not-supported-in-this-environment',\n    ]);\n    if (!fallbackCodes.has(error.code)) throw error;\n    await signInWithRedirect(auth, provider);\n    return null;\n  }\n}"""
          new="""async function googleLogin() {\n  const provider = new GoogleAuthProvider();\n  provider.setCustomParameters({ prompt: 'select_account' });\n  // Firebase recommends redirect on mobile browsers/PWA.\n  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') || window.matchMedia?.('(pointer: coarse)')?.matches;\n  if (isMobile) {\n    await signInWithRedirect(auth, provider);\n    return null;\n  }\n  try {\n    return await signInWithPopup(auth, provider);\n  } catch (error) {\n    const fallbackCodes = new Set(['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment']);\n    if (!fallbackCodes.has(error.code)) throw error;\n    await signInWithRedirect(auth, provider);\n    return null;\n  }\n}"""
          if old not in s: raise SystemExit('googleLogin block not found')
          s=s.replace(old,new,1)
          old2="""  googleBtn.onclick = async () => {\n    googleBtn.disabled = true;"""
          new2="""  const startGoogleLogin = async (event) => {\n    event.preventDefault();\n    event.stopPropagation();\n    if (googleBtn.disabled) return;\n    googleBtn.disabled = true;"""
          if old2 not in s: raise SystemExit('google button handler not found')
          s=s.replace(old2,new2,1)
          s=s.replace("  };\n}\n\nasync function ensureUserProfile", "  };\n  googleBtn.addEventListener('click', startGoogleLogin);\n  googleBtn.addEventListener('pointerup', startGoogleLogin);\n}\n\nasync function ensureUserProfile",1)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          node --check js/community.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/community.js
          git commit -m "fix: rebuild Community Google login flow"
          git push origin HEAD:main
