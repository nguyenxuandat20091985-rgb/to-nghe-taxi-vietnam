<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đền Tổ Nghề Taxi</title>
<meta name="theme-color" content="#1a0e05">
<link rel="icon" href="./icons/app-avatar.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/app-avatar.png">
<link rel="manifest" href="./manifest.json">
<style>
  body { background: #050301; color: #f0e0a0; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
  .loader { max-width: 320px; }
  h1 { color: #d4af37; font-size: 1.4rem; margin-bottom: 12px; }
  p { opacity: 0.85; line-height: 1.5; }
</style>
</head>
<body>
  <div class="loader">
    <h1>Đền Tổ Nghề Taxi</h1>
    <p>Đang tải nội dung đầy đủ...</p>
  </div>
  <script>
  (async function() {
    try {
      const url = 'https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/to-nghe-taxi-vietnam/c061045a57c0884f0b3cf32b249c4e5ed4d4b9e9/index.html';
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Fetch failed ' + res.status);
      let html = await res.text();
      // Fix the two icon references
      html = html.replace(/\.\/icons\/app-avatar\.jpg/g, './icons/app-avatar.png');
      // Write the full app
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.querySelector('.loader').innerHTML = '<h1>Đền Tổ Nghề Taxi</h1><p>Lỗi tải nội dung. Vui lòng thử lại sau.</p><p style="font-size:0.8rem;opacity:0.6">' + e.message + '</p>';
    }
  })();
  </script>
</body>
</html>
