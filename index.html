<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đền Tổ Nghề Taxi</title>
<meta name="theme-color" content="#1a0e05">
<meta name="description" content="Không gian số tri ân nghề taxi Việt Nam, cầu bình an và kết nối cộng đồng tài xế.">
<link rel="icon" href="./icons/app-avatar.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/app-avatar.png">
<link rel="manifest" href="./manifest.json">
<style>
  html,body{margin:0;padding:0;background:#050301;color:#f0e0a0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
  #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
  #boot .box{max-width:340px}
  #boot .logo{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e8c56a,#a67c1a);display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(212,175,55,.45);font-size:36px}
  #boot h1{font-size:1.35rem;color:#d4af37;margin:0 0 10px;font-weight:700}
  #boot p{opacity:.85;line-height:1.55;font-size:.95rem;margin:0}
  #boot .bar{margin-top:22px;height:3px;background:rgba(212,175,55,.2);border-radius:2px;overflow:hidden}
  #boot .bar>i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#a67c1a,#e8c56a);border-radius:2px;animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
</style>
</head>
<body>
  <div id="boot">
    <div class="box">
      <div class="logo">🚕</div>
      <h1>Đền Tổ Nghề Taxi</h1>
      <p>Đang tải ứng dụng...</p>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <script>
  (async function () {
    const CACHE_KEY = 'to-nghe-full-html-v23';
    const SOURCE = 'https://raw.githubusercontent.com/nguyenxuandat20091985-rgb/to-nghe-taxi-vietnam/c061045a57c0884f0b3cf32b249c4e5ed4d4b9e9/index.html';
    try {
      let html = null;
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached && cached.length > 100000) html = cached;
      } catch (_) {}
      if (!html) {
        const res = await fetch(SOURCE, { cache: 'no-store' });
        if (!res.ok) throw new Error('Không tải được nội dung (' + res.status + ')');
        html = await res.text();
        html = html.replace(/\.\/icons\/app-avatar\.jpg/g, './icons/app-avatar.png');
        try { localStorage.setItem(CACHE_KEY, html); } catch (_) {}
      } else {
        html = html.replace(/\.\/icons\/app-avatar\.jpg/g, './icons/app-avatar.png');
      }
      // Completely replace the document so no loader UI remains
      document.open('text/html', 'replace');
      document.write(html);
      document.close();
    } catch (e) {
      var boot = document.getElementById('boot');
      if (boot) {
        boot.innerHTML =
          '<div class="box">' +
          '<h1 style="color:#d4af37">Đền Tổ Nghề Taxi</h1>' +
          '<p style="margin-top:12px">Không tải được ứng dụng.</p>' +
          '<p style="font-size:0.8rem;opacity:0.6;margin-top:8px">' + (e.message || e) + '</p>' +
          '<p style="margin-top:16px"><a href="/" style="color:#e8c56a">Thử lại</a></p>' +
          '</div>';
      }
    }
  })();
  </script>
</body>
</html>
